name: Watch SJSU (backup)

# The 5-minute watch is scheduled by the database (pg_cron, migration 0019; see docs/auto-hunter.md). This private repo bills each run as at least one Actions
# minute, so a */5 schedule here (~8,600 runs a month) would exhaust the free minutes. This hourly run is only a backup.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Watch
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" && test -n "$CRON_SECRET"
          code=$(curl -sS --max-time 300 -o report.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/agent/watch")
          echo "HTTP $code"
          jq '{companies, created, failures, queued, hunter, ms}' report.json || true
          test "$code" = "200"
